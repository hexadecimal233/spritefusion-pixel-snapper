[package]
name = "spritefusion-pixel-snapper"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/main.rs"

[dependencies]
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
rand_chacha = "0.3"

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

# --- Size & performance optimizations ---
[profile.release]
opt-level = "z"        # Aggressive size optimization
lto = true             # Link-time optimization
codegen-units = 1      # Single codegen unit for better inlining
panic = "abort"        # Strip panic strings (biggest single size saver)
strip = "symbols"      # Remove all symbol information

# --- wasm-pack configuration ---
[package.metadata.wasm-pack.profile.release]
# wasm-opt further reduces binary size (~15-20% beyond LLVM alone)
# --enable-bulk-memory / --enable-nontrapping-float-to-int required for Rust 1.87+ (LLVM 20)
# wasm-opt disabled in wasm-pack (network-unreliable download).
# Run manually: wasm-opt -Oz --enable-bulk-memory pkg/*.wasm -o pkg/*.wasm
wasm-opt = false

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
debug-js-glue = false
demangle-name-section = true
dwarf-debug-info = false
